<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Bill | Expense Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="sidebar">

    <div>

        <h2>💰 Expense Tracker</h2>

        <nav>

            <a href="{{ url_for('home') }}">
                Dashboard
            </a>

            <a href="{{ url_for('expenses') }}">
                Expenses
            </a>

            <a
                class="active"
                href="{{ url_for('bills') }}"
            >
                Bills
            </a>

            <a href="{{ url_for('categories') }}">
                Categories
            </a>

            <a href="{{ url_for('reports') }}">Reports</a>

        </nav>

    </div>

    <div class="sidebar-footer">
        Personal Finance
    </div>

</div>


<main class="main-content">

    <div class="topbar">

        <div>

            <h1>Edit Bill</h1>

            <p>Update your bill details.</p>

        </div>

    </div>


    <section class="panel expense-form-panel">

        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Bill name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    value="{{ bill['name'] }}"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="amount">
                        Amount (£)
                    </label>

                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        min="0.01"
                        step="0.01"
                        value="{{ bill['amount'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="due_date">
                        Due date
                    </label>

                    <input
                        id="due_date"
                        name="due_date"
                        type="date"
                        value="{{ bill['due_date'] }}"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="category_id">
                        Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        required
                    >

                        {% for category in categories %}

                        <option
                            value="{{ category['id'] }}"
                            {% if category['id'] == bill['category_id'] %}
                            selected
                            {% endif %}
                        >
                            {{ category['name'] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option
                            value="Unpaid"
                            {% if bill['status'] == 'Unpaid' %}
                            selected
                            {% endif %}
                        >
                            Unpaid
                        </option>

                        <option
                            value="Paid"
                            {% if bill['status'] == 'Paid' %}
                            selected
                            {% endif %}
                        >
                            Paid
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="4"
                >{{ bill['notes'] or '' }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('bills') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="add-button"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </section>

</main>

</body>

</html>
