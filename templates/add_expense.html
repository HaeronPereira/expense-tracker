<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Expense Tracker</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>


<div class="sidebar">

    <div>

        <h2>💰 Expense Tracker</h2>

        <nav>

            <a href="{{ url_for('home') }}">
                Dashboard
            </a>

            <a class="active"
               href="{{ url_for('expenses') }}">
                Expenses
            </a>

            <a href="{{ url_for('bills') }}">Bills</a>

            <a href="{{ url_for('categories') }}">
                Categories
            </a>

            <a href="{{ url_for('reports') }}">Reports</a>

        </nav>

    </div>


    <div class="sidebar-footer">
        Personal Finance
    </div>

</div>


<main class="main-content">


    <div class="topbar">

        <div>

            <h1>Add Expense</h1>

            <p>
                Record a new expense in your tracker.
            </p>

        </div>

    </div>


    <section class="panel expense-form-panel">

        <form
            method="POST"
            action="{{ url_for('add_expense') }}"
        >


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <input
                    id="description"
                    name="description"
                    type="text"
                    placeholder="e.g. Tesco groceries"
                    required
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="amount">
                        Amount (£)
                    </label>

                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        min="0.01"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="expense_date">
                        Date
                    </label>

                    <input
                        id="expense_date"
                        name="expense_date"
                        type="date"
                        required
                    >

                </div>


            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="category_id">
                        Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        {% for category in categories %}

                        <option value="{{ category['id'] }}">
                            {{ category['name'] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                        name="payment_method"
                        required
                    >

                        <option value="">
                            Select payment method
                        </option>

                        <option value="Debit Card">
                            Debit Card
                        </option>

                        <option value="Credit Card">
                            Credit Card
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Bank Transfer">
                            Bank Transfer
                        </option>

                        <option value="Direct Debit">
                            Direct Debit
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="4"
                    placeholder="Optional notes"
                ></textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('home') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="add-button"
                >
                    Add Expense
                </button>

            </div>


        </form>

    </section>


</main>

</body>

</html>
